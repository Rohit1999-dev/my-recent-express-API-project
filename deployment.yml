apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_HOST: "host.docker.internal"
  DB_PORT: "3306"
  DB_NAME: "node_project"
  PORT: "3000"
  SALT: "10"

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  DB_USER: "appuser"
  DB_PASSWORD: "your_password_here"
  JWT_SECRET: "jwtdecodesecretkey"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment-application
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: backend-api-service-image:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          resources: 
            requests: 
              cpu: "100m" 
              memory: "128Mi"

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment-application
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
